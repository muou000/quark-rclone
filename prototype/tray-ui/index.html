<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夸克网盘挂载 - 托盘界面原型</title>
<!-- PROTOTYPE: three tray UI variants, switchable with ?variant=A|B|C -->
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#18212b;--muted:#6d7884;--line:#d9e0e6;--blue:#1f67d2;--blue-soft:#e9f1ff;--green:#1b8a61;--green-soft:#e8f6ef;--amber:#a66b00;--amber-soft:#fff4d8;--red:#b13a3a;--red-soft:#ffeded;--shadow:0 18px 50px rgba(24,33,43,.12);font-family:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.page{min-height:100vh;padding:26px 18px 110px}.shell{width:min(1060px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;font-weight:800}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:27px;line-height:1.15}h2{font-size:18px}h3{font-size:14px}.muted{font-size:13px;line-height:1.5;color:var(--muted)}.window button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted)}.window{display:flex;gap:7px}.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}.pad{padding:20px}.stack{display:grid;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.divider{height:1px;background:var(--line)}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:8px;padding:9px 13px;color:#fff;background:var(--blue);font-weight:700}.btn.secondary{color:var(--ink);background:#edf0f3}.btn.ghost{color:var(--blue);background:transparent;border:1px solid #b9d0f7}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:750}.pill.green{color:var(--green);background:var(--green-soft)}.pill.amber{color:var(--amber);background:var(--amber-soft)}.pill.red{color:var(--red);background:var(--red-soft)}.pill.blue{color:var(--blue);background:var(--blue-soft)}.dot{width:9px;height:9px;border-radius:50%;background:currentColor}.notice{display:grid;gap:7px;padding:13px;border-left:4px solid var(--blue);border-radius:8px;background:var(--blue-soft)}.notice.amber{border-color:#d38e00;background:var(--amber-soft)}.notice.red{border-color:var(--red);background:var(--red-soft)}.notice strong{font-size:13px}.notice p{font-size:12px;line-height:1.5;color:#495665}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:13px;border:1px solid var(--line);border-radius:9px}.metric strong{display:block;font-size:19px}.metric span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.scenario{margin-top:13px}.scenario select,.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;color:var(--ink)}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:650}
.variant-a{width:min(600px,100%);margin:38px auto}.hero{display:grid;gap:17px;padding:23px}.hero-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.drive{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fafcfe}.letter{display:grid;place-items:center;width:51px;height:51px;border:2px solid var(--blue);border-radius:10px;color:var(--blue);font-size:21px;font-weight:800}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{min-height:64px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;color:var(--ink)}.quick b{display:block;font-size:12px}.quick span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.variant-b{display:grid;grid-template-columns:235px minmax(0,1fr);gap:15px;margin-top:27px}.variant-b aside{display:grid;align-content:start;gap:7px;padding:14px}.nav{display:flex;justify-content:space-between;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left}.nav.active{background:var(--blue-soft);color:var(--blue);font-weight:700}.variant-b main{display:grid;gap:13px}.timeline{display:grid}.event{position:relative;display:grid;grid-template-columns:16px 1fr auto;gap:9px;padding:9px 0}.event:not(:last-child):before{content:"";position:absolute;left:5px;top:21px;bottom:-2px;width:1px;background:var(--line)}.event i{z-index:1;width:11px;height:11px;margin-top:3px;border:3px solid #fff;border-radius:50%;background:var(--blue);box-shadow:0 0 0 1px var(--blue)}.event.good i{background:var(--green);box-shadow:0 0 0 1px var(--green)}.event.warn i{background:#d38e00;box-shadow:0 0 0 1px #d38e00}.event b{display:block;font-size:12px}.event p{margin-top:3px;font-size:11px;color:var(--muted)}.event time{font-size:10px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--muted)}
.variant-c{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:15px;margin-top:31px}.setup{padding:23px}.steps{display:flex;gap:10px;margin:20px 0 23px}.step{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.step:after{content:">";margin-left:3px;color:#aab4bf}.step:last-child:after{display:none}.step b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e7ebef}.step.current{color:var(--blue);font-weight:700}.step.current b{color:#fff;background:var(--blue)}.step.done{color:var(--green)}.step.done b{color:var(--green);background:var(--green-soft)}.recovery{display:grid;align-content:start;gap:13px;padding:19px}.state-list{display:grid;gap:8px}.state-list button{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left}.state-list button.active{border-color:#9dbff5;background:var(--blue-soft)}.state-list small{color:var(--muted)}
.switcher{position:fixed;z-index:5;bottom:17px;left:50%;display:flex;align-items:center;gap:10px;transform:translateX(-50%);padding:8px 10px;border:1px solid #263342;border-radius:99px;background:#18212b;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.22)}.switcher button{width:28px;height:28px;border:0;border-radius:50%;background:#344454;color:#fff}.switcher button:hover{background:#4a5d70}.switch-label{min-width:160px;text-align:center;font-size:12px}.switch-label b{color:#9fc3ff}
@media(max-width:760px){.page{padding:17px 12px 105px}.variant-b,.variant-c{grid-template-columns:1fr}.variant-b aside{grid-template-columns:repeat(3,1fr)}.variant-b aside .muted{grid-column:1/-1}.quick,.metric-grid{grid-template-columns:1fr}.switch-label{min-width:125px}}
</style>
</head>
<body>
<div class="page"><div class="shell">
<div class="top"><div class="brand"><div class="mark">Q</div><div><div class="eyebrow">托盘界面原型</div><h1>夸克网盘挂载</h1></div></div><div class="window"><button title="最小化">_</button><button title="关闭">x</button></div></div>
<div id="app"></div>
</div></div>
<div class="switcher"><button id="prev">&lt;</button><div id="switch-label" class="switch-label"></div><button id="next">&gt;</button></div>
<script>
var names={A:"紧凑托盘面板",B:"运维控制台",C:"配置与恢复向导"};
var data={
 mounted:{state:"Mounted",label:"已挂载",tone:"green",title:"盘符已就绪",detail:"Q: 已在文件资源管理器中可用",next:"刚刚检查"},
 network:{state:"Recovering",label:"恢复中",tone:"amber",title:"等待网络",detail:"下一次尝试将在 30 秒后进行",next:"暂时无法访问夸克配置接口"},
 reauth:{state:"NeedsReauth",label:"需要重新认证",tone:"red",title:"需要重新登录",detail:"当前夸克 Cookie 已无法通过认证",next:"挂载已暂停，本地待上传文件安全保留"},
 winfsp:{state:"WinFspRequired",label:"需要 WinFsp",tone:"red",title:"WinFsp 需要处理",detail:"未找到匹配当前架构的运行时",next:"安装或修复 WinFsp 后重试"},
 conflict:{state:"DriveConflict",label:"盘符冲突",tone:"amber",title:"盘符已被占用",detail:"Q: 正被其他卷使用",next:"选择其他盘符或释放 Q:"},
 readonly:{state:"Mounted",label:"已挂载",tone:"blue",title:"已挂载，但能力有限",detail:"不支持复制和覆盖上传",next:"读取、上传、移动和重命名可用"}
};
var scenarioKey="mounted";
function s(){return data[scenarioKey]}
function pill(x){return '<span class="pill '+x.tone+'"><span class="dot"></span>'+x.label+'</span>'}
function selectBox(){return '<div class="scenario"><select id="scenario"><option value="mounted">已挂载</option><option value="network">恢复中 / 网络</option><option value="reauth">需要重新认证</option><option value="winfsp">需要 WinFsp</option><option value="conflict">盘符冲突</option><option value="readonly">已挂载 / 能力有限</option></select></div>'}
function events(){var x=s();var rows=[["good","Cookie 已验证","夸克配置和根目录列举成功","09:41"],["good","适配层已就绪","本机 WebDAV 端点运行正常","09:41"],[x.tone==="green"?"good":"warn",x.label,x.detail,"09:42"],["warn","下一步",x.next,"现在"]];return rows.map(function(r){return '<div class="event '+r[0]+'"><i></i><div><b>'+r[1]+'</b><p>'+r[2]+'</p></div><time>'+r[3]+'</time></div>'}).join("")}
function caps(){return [["列目录 / 读取","可用"],["上传","可用"],["新建目录 / 移动 / 重命名","可用"],["删除","可用"],["复制","不支持"],["覆盖上传","冲突"]].map(function(r){return '<tr><td>'+r[0]+'</td><td><span class="pill '+(r[1]==="可用"?"green":"amber")+'">'+r[1]+'</span></td></tr>'}).join("")}
function variantA(){var x=s();var middle=x.state==="NeedsReauth"?'<div class="notice red"><strong>重新认证后恢复挂载</strong><p>挂载配置和本地待上传文件都会保留。</p><div class="actions"><button class="btn">输入新 Cookie</button><button class="btn secondary">查看详情</button></div></div>':x.state==="WinFspRequired"?'<div class="notice red"><strong>安装 WinFsp</strong><p>挂载引擎需要匹配的运行时才能提供盘符。</p><div class="actions"><button class="btn">打开安装页面</button><button class="btn secondary">重新检查</button></div></div>':x.state==="DriveConflict"?'<div class="notice amber"><strong>选择空闲盘符</strong><p>Q: 已被占用，当前配置没有修改。</p><div class="actions"><button class="btn">选择盘符</button><button class="btn secondary">重试 Q:</button></div></div>':'<div class="drive"><div class="letter">Q:</div><div><strong>夸克根目录</strong><p class="muted">我的网盘 / 2,418 项</p></div><span style="margin-left:auto">'+pill(x)+'</span></div>';return '<section class="variant-a"><div class="card hero"><div class="hero-title"><div class="stack"><div class="eyebrow">单账号</div><h2>'+x.title+'</h2><p class="muted">'+x.detail+'</p></div>'+pill(x)+'</div>'+middle+'<div class="metric-grid"><div class="metric"><strong>2,418</strong><span>已索引项目</span></div><div class="metric"><strong>writes</strong><span>缓存模式</span></div><div class="metric"><strong>自动</strong><span>自动恢复</span></div></div><div class="actions"><button class="btn">'+(x.state==="Mounted"?"停止挂载":"重试挂载")+'</button><button class="btn secondary">打开盘符</button><button class="btn ghost">设置</button></div><div class="divider"></div><div class="row"><div><strong>Cookie 凭据</strong><p class="muted">已使用 Windows DPAPI 保护</p></div><button class="btn secondary">替换</button></div>'+selectBox()+'</div></section>'}
function variantB(){var x=s();return '<section class="variant-b"><aside class="card"><div class="eyebrow">工作区</div><h2>Q: 夸克网盘</h2><p class="muted">单账号挂载</p><button class="nav active"><span>概览</span><span>'+x.label+'</span></button><button class="nav"><span>能力</span><span>6 / 8</span></button><button class="nav"><span>诊断</span><span>4 条记录</span></button><div class="divider"></div><p class="muted">配置<br><strong>登录后自动启动</strong><br><strong>缓存：writes</strong></p>'+selectBox()+'</aside><main><div class="card pad"><div class="row"><div><div class="eyebrow">挂载监督器</div><h2>'+x.title+'</h2><p class="muted">'+x.next+'</p></div>'+pill(x)+'</div><div class="actions" style="margin-top:15px"><button class="btn">立即重试</button><button class="btn secondary">停止挂载</button><button class="btn secondary">更换盘符</button><button class="btn ghost">导出脱敏日志</button></div></div><div class="card pad"><div class="row"><h2>恢复时间线</h2><span class="muted">今天</span></div><div class="timeline">'+events()+'</div></div><div class="card pad"><div class="row"><h2>操作能力</h2><span class="muted">上次探测：09:41</span></div><table><thead><tr><th>操作</th><th>结果</th></tr></thead><tbody>'+caps()+'</tbody></table></div></main></section>'}
function variantC(){var x=s();var reauth=x.state==="NeedsReauth";return '<section class="variant-c"><div class="card setup"><div class="eyebrow">'+(reauth?"恢复访问":"首次配置")+'</div><h2 style="margin-top:6px">'+(reauth?"重新连接夸克账号":"挂载夸克网盘")+'</h2><p class="muted" style="margin-top:8px">'+(reauth?"盘符配置和本地待上传文件都会保留。":"完成三个步骤后，网盘会出现在文件资源管理器中。")+'</p><div class="steps"><div class="step done"><b>1</b>Cookie</div><div class="step current"><b>2</b>根目录</div><div class="step"><b>3</b>挂载</div></div>'+(reauth?'<div class="notice red"><strong>Cookie 已失效</strong><p>粘贴新的浏览器 Cookie。验证通过后才会替换受保护的凭据。</p></div><div class="field" style="margin-top:15px"><label>新 Cookie</label><input type="password" placeholder="粘贴 Cookie 字符串"></div><div class="actions" style="margin-top:15px"><button class="btn">验证并恢复</button><button class="btn secondary">保持暂停</button></div>':'<div class="stack"><div class="field"><label>浏览器 Cookie</label><input type="password" value="••••••••••••••••" readonly></div><div class="field"><label>夸克根目录</label><select><option>我的网盘 /</option><option>归档 /</option></select></div><div class="field"><label>盘符</label><select><option>Q:（自动）</option><option>R:</option><option>S:</option></select></div><div class="notice"><strong>准备验证</strong><p>程序会列出所选根目录，不会修改夸克文件。</p></div><div class="actions"><button class="btn">验证并挂载</button><button class="btn secondary">高级设置</button></div></div>')+'</div><div class="card recovery"><div class="eyebrow">接下来会发生什么</div><h2>恢复控制</h2><p class="muted">选择场景查看对应的用户操作。</p><div class="state-list"><button data-s="network"><span><strong>网络不可用</strong><br><small>自动重试</small></span><span class="pill amber">恢复中</span></button><button data-s="winfsp"><span><strong>缺少 WinFsp</strong><br><small>安装后重新检查</small></span><span class="pill red">已阻塞</span></button><button data-s="conflict"><span><strong>盘符已被占用</strong><br><small>选择空闲盘符</small></span><span class="pill amber">需要操作</span></button><button data-s="readonly"><span><strong>操作能力有限</strong><br><small>复制不可用</small></span><span class="pill blue">提示</span></button></div><div class="divider"></div><div class="row"><span class="muted">自动恢复</span><strong style="color:var(--green)">已开启</strong></div></div></section>'}
function render(){var p=new URLSearchParams(location.search);var v=(p.get("variant")||"A").toUpperCase();if(["A","B","C"].indexOf(v)<0)v="A";document.getElementById("app").innerHTML=v==="A"?variantA():v==="B"?variantB():variantC();document.getElementById("switch-label").innerHTML="<b>"+v+"</b> · "+names[v];var sel=document.getElementById("scenario");if(sel){sel.value=scenarioKey;sel.onchange=function(e){scenarioKey=e.target.value;render()}}document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){scenarioKey=b.dataset.s;render()}})}
function move(n){var p=new URLSearchParams(location.search);var v=(p.get("variant")||"A").toUpperCase(),a=["A","B","C"],i=a.indexOf(v);history.replaceState({}, "", "?variant="+a[(i+n+a.length)%a.length]);render()}
document.getElementById("prev").onclick=function(){move(-1)};document.getElementById("next").onclick=function(){move(1)};document.onkeydown=function(e){var t=document.activeElement&&document.activeElement.tagName;if(["INPUT","TEXTAREA","SELECT"].indexOf(t)>=0)return;if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)};render();
</script>
</body>
</html>
